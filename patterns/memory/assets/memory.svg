<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2d3748"/></marker>
  </defs>
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Memory: the Part 5 chain, with recall before and remember after</text>

  <rect x="20" y="80" width="130" height="100" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/>
  <text x="85" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">0. Recall</text>
  <text x="85" y="138" text-anchor="middle" font-size="13" fill="#4a5568">Facts + lessons</text>
  <text x="85" y="156" text-anchor="middle" font-size="13" fill="#4a5568">for this person</text>

  <rect x="175" y="80" width="130" height="100" rx="10" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
  <text x="240" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">1. Gather</text>
  <text x="240" y="138" text-anchor="middle" font-size="13" fill="#4a5568">Same four facts</text>

  <rect x="330" y="80" width="130" height="100" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="395" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">2. Decide</text>
  <text x="395" y="138" text-anchor="middle" font-size="13" fill="#4a5568">Facts + memory</text>

  <rect x="485" y="80" width="130" height="100" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="550" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">3. Draft</text>
  <text x="550" y="138" text-anchor="middle" font-size="13" fill="#4a5568">Follows lessons</text>

  <rect x="640" y="80" width="130" height="100" rx="10" fill="#e6fffa" stroke="#2c7a7b" stroke-width="2"/>
  <text x="705" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">4. Check</text>
  <text x="705" y="138" text-anchor="middle" font-size="13" fill="#4a5568">Times real?</text>

  <rect x="795" y="80" width="145" height="100" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/>
  <text x="867" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">5. Remember</text>
  <text x="867" y="138" text-anchor="middle" font-size="13" fill="#4a5568">Log this run</text>

  <line x1="150" y1="130" x2="173" y2="130" stroke="#2d3748" stroke-width="2" marker-end="url(#a)"/>
  <line x1="305" y1="130" x2="328" y2="130" stroke="#2d3748" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="130" x2="483" y2="130" stroke="#2d3748" stroke-width="2" marker-end="url(#a)"/>
  <line x1="615" y1="130" x2="638" y2="130" stroke="#2d3748" stroke-width="2" marker-end="url(#a)"/>
  <line x1="770" y1="130" x2="793" y2="130" stroke="#2d3748" stroke-width="2" marker-end="url(#a)"/>

  <rect x="200" y="250" width="560" height="100" rx="10" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
  <text x="480" y="278" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Memory file (memory.json)</text>
  <text x="480" y="302" text-anchor="middle" font-size="13" fill="#4a5568">Facts: "bike's tire is fixed" (household) · "prefers the bus in rain" (only me)</text>
  <text x="480" y="322" text-anchor="middle" font-size="13" fill="#4a5568">Episodes: past runs, what happened, and the lesson, if it was the assistant's mistake</text>

  <path d="M198,300 L85,300 L85,183" fill="none" stroke="#6b46c1" stroke-width="2" marker-end="url(#a)"/>
  <text x="92" y="240" font-size="13" fill="#6b46c1">read</text>
  <path d="M867,180 L867,300 L762,300" fill="none" stroke="#6b46c1" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="874" y="240" font-size="13" fill="#6b46c1">write</text>
</svg>
