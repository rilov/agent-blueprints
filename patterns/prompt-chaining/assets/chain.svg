<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2d3748"/></marker>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Prompt chaining: fixed steps, each feeding the next</text>

  <rect x="30" y="90" width="190" height="110" rx="10" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
  <text x="125" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">1. Gather</text>
  <text x="125" y="146" text-anchor="middle" font-size="13" fill="#4a5568">Plain code</text>
  <text x="125" y="166" text-anchor="middle" font-size="13" fill="#4a5568">Same four facts</text>

  <rect x="260" y="90" width="190" height="110" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="355" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">2. Decide</text>
  <text x="355" y="146" text-anchor="middle" font-size="13" fill="#4a5568">Model call</text>
  <text x="355" y="166" text-anchor="middle" font-size="13" fill="#4a5568">Bike or bus?</text>

  <rect x="490" y="90" width="190" height="110" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="585" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">3. Draft</text>
  <text x="585" y="146" text-anchor="middle" font-size="13" fill="#4a5568">Model call</text>
  <text x="585" y="166" text-anchor="middle" font-size="13" fill="#4a5568">Write the reply</text>

  <rect x="720" y="90" width="210" height="110" rx="10" fill="#e6fffa" stroke="#2c7a7b" stroke-width="2"/>
  <text x="825" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">4. Check</text>
  <text x="825" y="146" text-anchor="middle" font-size="13" fill="#4a5568">Plain code gate</text>
  <text x="825" y="166" text-anchor="middle" font-size="13" fill="#4a5568">Times on timetable?</text>

  <line x1="220" y1="145" x2="258" y2="145" stroke="#2d3748" stroke-width="2" marker-end="url(#a)"/>
  <line x1="450" y1="145" x2="488" y2="145" stroke="#2d3748" stroke-width="2" marker-end="url(#a)"/>
  <line x1="680" y1="145" x2="718" y2="145" stroke="#2d3748" stroke-width="2" marker-end="url(#a)"/>

  <line x1="825" y1="200" x2="825" y2="232" stroke="#c53030" stroke-width="2" marker-end="url(#a)"/>
  <text x="825" y="256" text-anchor="middle" font-size="13" fill="#c53030">wrong time: stop, send nothing</text>
  <text x="480" y="270" text-anchor="middle" font-size="13" fill="#4a5568">Right time: the reply goes out. The order never changes.</text>
</svg>
