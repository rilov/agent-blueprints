<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="One question fans out to the store, warehouse and courier, then fans in to one answer">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .ink{fill:#16171D}.muted{fill:#5B5E6B}.panel{fill:#F2F3F8}.wire{stroke:#8E91A0}.tag{fill:#7A3CF0}
    @media (prefers-color-scheme:dark){.ink{fill:#ECEDF3}.muted{fill:#A5A8B8}.panel{fill:#262833}.tag{fill:#B49BFF}}
  </style>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8E91A0"/></marker></defs>
  <g fill="none" class="wire" stroke-width="2.5" marker-end="url(#a)">
    <path d="M190 180C260 180 260 62 330 62"/><path d="M190 180H330"/><path d="M190 180C260 180 260 298 330 298"/>
    <path d="M570 62C640 62 640 180 708 180"/><path d="M570 180H708"/><path d="M570 298C640 298 640 180 708 180"/>
  </g>
  <rect x="10" y="130" width="180" height="100" rx="16" fill="#1473E6"/>
  <text x="100" y="172" font-size="21" font-weight="700" text-anchor="middle" fill="#fff">One</text>
  <text x="100" y="200" font-size="21" font-weight="700" text-anchor="middle" fill="#fff">question</text>
  <g text-anchor="middle" fill="#fff">
    <rect x="334" y="20" width="236" height="84" rx="16" fill="#00806A"/>
    <text x="452" y="56" font-size="21" font-weight="700">Store</text><text x="452" y="84" font-size="18">Is it paid?</text>
    <rect x="334" y="138" width="236" height="84" rx="16" fill="#C94F02"/>
    <text x="452" y="174" font-size="21" font-weight="700">Warehouse</text><text x="452" y="202" font-size="18">Is it packed?</text>
    <rect x="334" y="256" width="236" height="84" rx="16" fill="#DE1283"/>
    <text x="452" y="292" font-size="21" font-weight="700">Courier</text><text x="452" y="320" font-size="18">Was it collected?</text>
  </g>
  <rect x="712" y="130" width="178" height="100" rx="16" fill="#7A3CF0"/>
  <text x="801" y="172" font-size="21" font-weight="700" text-anchor="middle" fill="#fff">One</text>
  <text x="801" y="200" font-size="21" font-weight="700" text-anchor="middle" fill="#fff">answer</text>
  <text x="240" y="368" font-size="22" font-weight="800" text-anchor="middle" class="tag">Fan-out</text>
  <text x="662" y="368" font-size="22" font-weight="800" text-anchor="middle" class="tag">Fan-in</text>
</svg>
