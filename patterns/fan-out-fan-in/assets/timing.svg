<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Run one after another, three one-second tasks take three seconds. Run at the same time, they take one second.">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .ink{fill:#16171D}.muted{fill:#5B5E6B}.panel{fill:#F2F3F8}.grid{stroke:#C9CBD6}
    @media (prefers-color-scheme:dark){.ink{fill:#ECEDF3}.muted{fill:#A5A8B8}.panel{fill:#262833}.grid{stroke:#4A4C5A}}
  </style>
  <rect x="4" y="4" width="892" height="392" rx="22" class="panel"/>
  <g class="grid" stroke-width="1.5" stroke-dasharray="5 6">
    <path d="M150 34V350"/><path d="M380 34V350"/><path d="M610 34V350"/><path d="M840 34V350"/>
  </g>
  <g font-size="18" font-weight="600" text-anchor="middle" class="muted">
    <text x="150" y="378">0s</text><text x="380" y="378">1s</text><text x="610" y="378">2s</text><text x="840" y="378">3s</text>
  </g>
  <text x="30" y="56" font-size="20" font-weight="800" class="ink">One after</text>
  <text x="30" y="82" font-size="20" font-weight="800" class="ink">another</text>
  <g font-size="18" font-weight="700" text-anchor="middle" fill="#fff">
    <rect x="150" y="44" width="226" height="42" rx="9" fill="#00806A"/><text x="263" y="71">Store</text>
    <rect x="380" y="44" width="226" height="42" rx="9" fill="#C94F02"/><text x="493" y="71">Warehouse</text>
    <rect x="610" y="44" width="226" height="42" rx="9" fill="#DE1283"/><text x="723" y="71">Courier</text>
  </g>
  <text x="840" y="118" font-size="20" font-weight="800" text-anchor="end" class="ink">3 seconds</text>
  <text x="30" y="210" font-size="20" font-weight="800" class="ink">Fan-out</text>
  <text x="30" y="236" font-size="20" font-weight="800" class="ink">(same time)</text>
  <g font-size="18" font-weight="700" text-anchor="middle" fill="#fff">
    <rect x="150" y="166" width="226" height="42" rx="9" fill="#00806A"/><text x="263" y="193">Store</text>
    <rect x="150" y="216" width="226" height="42" rx="9" fill="#C94F02"/><text x="263" y="243">Warehouse</text>
    <rect x="150" y="266" width="226" height="42" rx="9" fill="#DE1283"/><text x="263" y="293">Courier</text>
  </g>
  <text x="396" y="244" font-size="20" font-weight="800" class="ink">1 second: as long as the slowest task</text>
</svg>
