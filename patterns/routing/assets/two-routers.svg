<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="The same question, 'Is cycling a good idea tomorrow?', goes to two routers. Keyword rules send it to the wrong route, other. A small model sends it to the right route, plan">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .ink{fill:#16171D}.muted{fill:#5B5E6B}.panel{fill:#F2F3F8}.wire{stroke:#8E91A0}.tag{fill:#7A3CF0}
    @media (prefers-color-scheme:dark){.ink{fill:#ECEDF3}.muted{fill:#A5A8B8}.panel{fill:#262833}.tag{fill:#B49BFF}}
  </style>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8E91A0"/></marker></defs>
  <rect x="250" y="14" width="400" height="60" rx="30" fill="#1473E6"/>
  <text x="450" y="52" font-size="20" font-weight="700" text-anchor="middle" fill="#fff">“Is cycling a good idea tomorrow?”</text>
  <g fill="none" class="wire" stroke-width="2.5" marker-end="url(#a)">
    <path d="M360 74C360 105 225 95 225 128"/>
    <path d="M540 74C540 105 675 95 675 128"/>
    <path d="M225 230V288"/>
    <path d="M675 230V288"/>
  </g>
  <rect x="55" y="130" width="340" height="100" rx="16" fill="#C94F02"/>
  <g text-anchor="middle" fill="#fff"><text x="225" y="166" font-size="21" font-weight="700">Keyword rules</text><text x="225" y="192" font-size="16">Free and fast.</text><text x="225" y="214" font-size="16">Only knows your words.</text></g>
  <rect x="505" y="130" width="340" height="100" rx="16" fill="#C94F02"/>
  <g text-anchor="middle" fill="#fff"><text x="675" y="166" font-size="21" font-weight="700">Small model</text><text x="675" y="192" font-size="16">One cheap model call.</text><text x="675" y="214" font-size="16">Understands the meaning.</text></g>
  <rect x="55" y="290" width="340" height="84" rx="16" fill="#5B5E6B"/>
  <g text-anchor="middle" fill="#fff"><text x="225" y="326" font-size="21" font-weight="700">other  →  Fixed reply</text><text x="225" y="353" font-size="16">Wrong route. A miss.</text></g>
  <rect x="505" y="290" width="340" height="84" rx="16" fill="#7A3CF0"/>
  <g text-anchor="middle" fill="#fff"><text x="675" y="326" font-size="21" font-weight="700">plan  →  ReAct agent</text><text x="675" y="353" font-size="16">Right route.</text></g>
</svg>
