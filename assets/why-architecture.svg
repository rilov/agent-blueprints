<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="The same model gives a useless answer alone, and a useful answer when architecture connects it to the store, warehouse and courier">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .ink{fill:#16171D}.muted{fill:#5B5E6B}.panel{fill:#F2F3F8}.wire{stroke:#8E91A0}
    @media (prefers-color-scheme:dark){.ink{fill:#ECEDF3}.muted{fill:#A5A8B8}.panel{fill:#262833}.wire{stroke:#8E91A0}}
  </style>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8E91A0"/></marker></defs>
  <rect x="4" y="4" width="480" height="462" rx="22" class="panel"/>
  <rect x="516" y="4" width="480" height="462" rx="22" class="panel"/>
  <text x="34" y="54" font-size="27" font-weight="800" class="ink">Model alone</text>
  <text x="546" y="54" font-size="27" font-weight="800" class="ink">Model + architecture</text>

  <rect x="34" y="84" width="420" height="62" rx="12" fill="#1473E6"/>
  <text x="244" y="123" font-size="21" font-weight="700" text-anchor="middle" fill="#fff">“Where’s my order?”</text>
  <path d="M244 146V196" class="wire" stroke-width="2.5" marker-end="url(#a)" fill="none"/>
  <rect x="144" y="200" width="200" height="62" rx="12" fill="#7A3CF0"/>
  <text x="244" y="239" font-size="21" font-weight="700" text-anchor="middle" fill="#fff">Model</text>
  <path d="M244 262V322" class="wire" stroke-width="2.5" marker-end="url(#a)" fill="none"/>
  <text x="244" y="360" font-size="23" font-weight="700" text-anchor="middle" class="ink">“Your payment was</text>
  <text x="244" y="390" font-size="23" font-weight="700" text-anchor="middle" class="ink">successful.”</text>
  <text x="244" y="432" font-size="20" font-weight="600" text-anchor="middle" fill="#D1132F">Accurate, but no help</text>

  <rect x="546" y="84" width="420" height="62" rx="12" fill="#1473E6"/>
  <text x="756" y="123" font-size="21" font-weight="700" text-anchor="middle" fill="#fff">“Where’s my order?”</text>
  <g font-size="18" font-weight="700" text-anchor="middle" fill="#fff">
    <rect x="546" y="182" width="130" height="46" rx="10" fill="#00806A"/><text x="611" y="211">Store</text>
    <rect x="691" y="182" width="130" height="46" rx="10" fill="#C94F02"/><text x="756" y="211">Warehouse</text>
    <rect x="836" y="182" width="130" height="46" rx="10" fill="#DE1283"/><text x="901" y="211">Courier</text>
  </g>
  <g fill="none" stroke-width="2.5" class="wire" marker-end="url(#a)">
    <path d="M700 146L625 179"/><path d="M756 146V179"/><path d="M812 146L887 179"/>
    <path d="M611 228L700 261"/><path d="M756 228V261"/><path d="M901 228L812 261"/>
  </g>
  <rect x="656" y="264" width="200" height="56" rx="12" fill="#7A3CF0"/>
  <text x="756" y="300" font-size="21" font-weight="700" text-anchor="middle" fill="#fff">Model</text>
  <path d="M756 320V342" class="wire" stroke-width="2.5" marker-end="url(#a)" fill="none"/>
  <text x="756" y="372" font-size="23" font-weight="700" text-anchor="middle" class="ink">“It’s at the warehouse. The</text>
  <text x="756" y="402" font-size="23" font-weight="700" text-anchor="middle" class="ink">courier collects it tomorrow.”</text>
  <text x="756" y="438" font-size="20" font-weight="600" text-anchor="middle" fill="#00997F">Answers the real question</text>
</svg>
